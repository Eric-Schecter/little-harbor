[preset.0]
name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
export_files=PackedStringArray()
include_filter="assets/fonts/*LICENSE.txt"
exclude_filter="archive/*,docs/*,captures/*,tests/*,tools/*,build/*,.export_templates/*,assets/harbor/cover-v1.png,assets/audio/harbor/bgm-samples/*,assets/audio/harbor/*source*,assets/audio/harbor/foley-v2/*.mp3,assets/audio/harbor/specialties-v1/*.mp3,*.md,*.json,*.py,*.mjs"
export_path="build/web/index.html"
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release="res://.export_templates/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/custom_html_shell="res://tools/web_shell.html"
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
